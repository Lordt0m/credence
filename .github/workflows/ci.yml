name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Test on ${{ matrix.os }} (Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.13"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .[dev]

      - name: Run test suite
        run: |
          pytest -v

      - name: Verify CLI console script entry point
        shell: bash
        run: |
          mkdir -p /tmp/credence_cli_test 2>/dev/null || mkdir -p ./temp_cli_out
          OUT_DIR="${RUNNER_TEMP:-./temp_cli_out}/out_cli"
          credence check fixtures/mixed_cashbook.csv --output-dir "$OUT_DIR" || test $? -eq 1
          test -f "$OUT_DIR/clean-transactions.csv"
          test -f "$OUT_DIR/validation-errors.csv"
          test -f "$OUT_DIR/summary.json"

      - name: Verify Python module entry point
        shell: bash
        run: |
          OUT_DIR="${RUNNER_TEMP:-./temp_module_out}/out_module"
          python -m credence check fixtures/mixed_cashbook.csv --output-dir "$OUT_DIR" || test $? -eq 1
          test -f "$OUT_DIR/clean-transactions.csv"
          test -f "$OUT_DIR/validation-errors.csv"
          test -f "$OUT_DIR/summary.json"

      - name: Check for unstaged git modifications
        run: |
          git diff --check
          git status --porcelain
